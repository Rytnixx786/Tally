[project]
name = "tally"
version = "0.1.0"
description = "Cost per correct outcome for LLM traffic: a reproducible study of baseline, local, hosted and cascade setups on support-ticket triage."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=17",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "huggingface-hub>=0.25",
    "datasketch>=1.6",
    "httpx>=0.27",
    "jinja2>=3.1",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-proto>=1.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "psycopg[binary]>=3.2",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.39", "plotly>=5.24"]
dbt = ["dbt-postgres>=1.9"]

[project.scripts]
tally = "tally.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "respx>=0.21",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
    "pandas-stubs>=2.2",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tally"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PT", "C4"]
ignore = ["RUF001", "RUF002", "RUF003", "E501"]  # line length is enforced by `ruff format`; long literals are allowed

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802", "N806", "PT018"]
"dashboard/**" = ["N802"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["tally"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["datasketch.*", "sklearn.*", "scipy.*", "huggingface_hub.*", "matplotlib.*", "opentelemetry.proto.*", "google.protobuf.*", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
    "integration: needs Postgres (TALLY_TEST_DSN) or other services",
    "network: needs internet access",
]

[tool.coverage.run]
source = ["src/tally"]
branch = true
omit = ["src/tally/cli.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
