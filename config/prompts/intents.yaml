# One-line description per intent, written from the label names and dev-split examples only.
# Used by every LLM prompt. Never edit after the test run without bumping prompt versions.
intents:
  cancel_order: "Customer wants to cancel an order they placed."
  change_order: "Customer wants to modify items or details of an existing order."
  change_shipping_address: "Customer wants to change or update a shipping address already on file."
  check_cancellation_fee: "Customer asks whether there is a fee or charge for cancelling."
  check_invoice: "Customer wants to view or look up an existing invoice or bill."
  check_payment_methods: "Customer asks which payment methods or options are accepted."
  check_refund_policy: "Customer asks about the refund or money-back policy in general."
  complaint: "Customer wants to file a complaint or claim about a product, service or experience."
  contact_customer_service: "Customer wants to reach customer service (hours, phone, how to contact)."
  contact_human_agent: "Customer explicitly wants to talk to a live human or person, not a bot."
  create_account: "Customer wants to open, register or sign up for a new account."
  delete_account: "Customer wants to close, delete or remove their account."
  delivery_options: "Customer asks which delivery or shipping methods are available."
  delivery_period: "Customer asks when an order or delivery will arrive, or how long delivery takes."
  edit_account: "Customer wants to edit or update details of their existing account or profile."
  get_invoice: "Customer wants to receive, download or be sent an invoice."
  get_refund: "Customer wants to request or obtain a refund for a purchase."
  newsletter_subscription: "Customer wants to subscribe to, unsubscribe from, or manage the newsletter."
  payment_issue: "Customer reports a problem with a payment (failed, declined, error)."
  place_order: "Customer wants to buy something or make a new order."
  recover_password: "Customer forgot or wants to reset their password or login key."
  registration_problems: "Customer reports a problem or error while trying to register or sign up."
  review: "Customer wants to leave a review, rating or feedback about a product or service."
  set_up_shipping_address: "Customer wants to add or set up a new shipping address."
  switch_account: "Customer wants to switch to a different account or change account type/plan."
  track_order: "Customer wants to know the status or location of an order."
  track_refund: "Customer wants to know the status of a refund already requested."
