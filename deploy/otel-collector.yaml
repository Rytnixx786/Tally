# OpenTelemetry Collector (contrib). Receives OTLP from Cinch and the Tally harness, strips any
# prompt/response content attributes (defence in depth), batches, and forwards OTLP/HTTP JSON to
# tally-ingest, which writes raw.otel_spans in Postgres (ADR-002).
receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
      http: { endpoint: 0.0.0.0:4318 }

processors:
  attributes/strip_content:
    actions:
      - { key: gen_ai.input.messages, action: delete }
      - { key: gen_ai.output.messages, action: delete }
      - { key: gen_ai.system_instructions, action: delete }
      - { key: gen_ai.prompt, action: delete }
      - { key: gen_ai.completion, action: delete }
  batch:
    send_batch_size: 2048
    timeout: 2s

exporters:
  otlphttp/tally:
    endpoint: http://tally-ingest:8090
    encoding: json
    compression: none
    retry_on_failure: { enabled: true, max_elapsed_time: 120s }
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [attributes/strip_content, batch]
      exporters: [otlphttp/tally]
