name: tally
version: "1.0.0"
config-version: 2
profile: tally

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: target
clean-targets: [target, dbt_packages]

models:
  tally:
    +persist_docs: { relation: true, columns: true }
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: table
    marts:
      +schema: marts
      +materialized: table
      +contract: { enforced: true }
      +post-hook: "grant select on {{ this }} to lexicon_ro"

flags:
  send_anonymous_usage_stats: false
