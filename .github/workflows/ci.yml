name: ci

on:
  push: { branches: [main] }
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { python-version: "3.12" }
      - run: uv sync --all-extras
      - run: uv run ruff check src tests dashboard
      - run: uv run ruff format --check src tests dashboard
      - run: uv run mypy
      - run: uv run pytest -m "not integration" --cov --cov-report=term --cov-fail-under=85

  warehouse:
    # Builds the warehouse from the committed sample run with real Postgres + ingest, then runs every
    # dbt contract and data test and the integration tests.
    runs-on: ubuntu-latest
    needs: lint-test
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: tally, POSTGRES_USER: tally_admin, POSTGRES_PASSWORD: tally_admin_local }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tally_admin -d tally" --health-interval 5s --health-retries 20
    env:
      POSTGRES_PASSWORD: tally_writer_local
      LEXICON_RO_PASSWORD: lexicon_ro_local
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { python-version: "3.12" }
      - run: uv sync --all-extras
      - run: uv run tally db-init --admin-dsn postgresql://tally_admin:tally_admin_local@localhost:5432/tally
      - name: start tally-ingest
        run: |
          TALLY_INGEST_DSN=postgresql://tally_writer:tally_writer_local@localhost:5432/tally \
            uv run uvicorn tally.ingest.app:app --port 8090 &
          sleep 5 && curl -fs localhost:8090/health
      - run: uv run tally publish --run-id main --otlp http://localhost:8090
      - run: uv run tally dbt build
      - run: uv run tally report --run-id main --source warehouse
      - name: metrics must match the committed ones (reproducibility)
        run: git diff --exit-code reports/runs/main/metrics.json
      - run: uv run pytest -m integration
